# Brings the migrated site up locally so it can be checked by hand.
# See scripts/local-check.md for what to look at once it is running.
name: wideops-wordpress-local

services:
  db:
    image: mysql:8.0
    # The app reaches MySQL through the socket volume below, so nothing is
    # published to the host and MySQL binds only the container's own loopback.
    # Keeping it off the host network avoids colliding with a local MySQL.
    command: ["--bind-address=127.0.0.1"]
    environment:
      # These must match app/wp-config.php, which is supplied unmodified.
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: Foxtrot01
      MYSQL_ROOT_PASSWORD: Foxtrot01
      LOCAL_URL: http://localhost
    volumes:
      # PHP treats the literal host "localhost" as a request for a Unix socket,
      # so the supplied wp-config.php reaches MySQL through this shared volume
      # rather than over TCP.
      - mysql-socket:/var/run/mysqld
      - ./data/wordpress.sql:/docker-entrypoint-initdb.d/01-import-dump.sql:ro
      - ./scripts/rewrite-local-urls.sh:/docker-entrypoint-initdb.d/02-rewrite-urls.sh:ro
      - ./data/rewrite-urls.sql:/opt/rewrite-urls.sql:ro
    healthcheck:
      # The entrypoint imports the dump against a temporary server started with
      # --skip-networking, and that server shares this container's socket. A
      # loopback TCP check is therefore the signal that the import has finished,
      # where a socket check would pass against the half-imported server.
      test:
        [
          "CMD-SHELL",
          'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping --host=127.0.0.1 --user=root --silent',
        ]
      interval: 2s
      timeout: 5s
      retries: 45

  app:
    build: ./app
    image: wideops-wordpress:local
    ports:
      - "80:80"
    volumes:
      - mysql-socket:/var/run/mysqld
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost/"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  mysql-socket:
