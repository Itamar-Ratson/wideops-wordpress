# Brings the migrated site up locally so it can be checked by hand.
# See checklist.md for what to look at once it is running.
name: wideops-wordpress-local

services:
  db:
    image: mysql:8.0
    # No ports mapping: MySQL stays reachable only from the app container on the
    # Compose network, so a MySQL already running on the host cannot collide.
    environment:
      # These must match app/wp-config.php.
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: Foxtrot01
      MYSQL_ROOT_PASSWORD: Foxtrot01
      LOCAL_URL: http://localhost
    volumes:
      - ../data/wordpress.sql:/docker-entrypoint-initdb.d/01-import-dump.sql:ro
      - ./rewrite-urls.sh:/docker-entrypoint-initdb.d/02-rewrite-urls.sh:ro
      - ../data/rewrite-urls.sql:/opt/rewrite-urls.sql:ro
    healthcheck:
      # The entrypoint imports the dump against a temporary server started with
      # --skip-networking, and that server shares this container's socket. A
      # loopback TCP check is therefore the signal that the import has finished,
      # where a socket check would pass against the half-imported server.
      test:
        [
          "CMD-SHELL",
          'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping --host=127.0.0.1 --user=root --silent',
        ]
      interval: 2s
      timeout: 5s
      retries: 45

  app:
    build: ../app
    image: wideops-wordpress:local
    environment:
      DB_HOST: db
      SITE_URL: http://localhost
    ports:
      - "80:80"
    volumes:
      - ../app/wp-content/uploads:/var/www/html/wp-content/uploads:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost/"]
      interval: 2s
      timeout: 5s
      retries: 45
